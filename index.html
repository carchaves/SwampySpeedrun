<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ritual de Ducha</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e9aa8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="bubbles" aria-hidden="true">
    <div class="bubble" style="left:8%; width:44px; height:44px; animation-duration:15s, 6s; animation-delay:0s, 0s;"></div>
    <div class="bubble" style="left:26%; width:20px; height:20px; animation-duration:11s, 5s; animation-delay:2s, 0s;"></div>
    <div class="bubble" style="left:47%; width:32px; height:32px; animation-duration:18s, 7s; animation-delay:4s, 0s;"></div>
    <div class="bubble" style="left:66%; width:14px; height:14px; animation-duration:9s, 4s; animation-delay:1s, 0s;"></div>
    <div class="bubble" style="left:84%; width:52px; height:52px; animation-duration:20s, 8s; animation-delay:3s, 0s;"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"></path><path d="M5 9h14l-2.5 3.5h-9z"></path><path d="M8.5 16v2"></path><path d="M12 17v2.5"></path><path d="M15.5 16v2"></path></svg>
      </div>
      <input id="routineName" placeholder="Nombre de la rutina" class="routine-name">
    </div>
    <button id="voiceToggle" class="icon-btn voice-btn" title="Voz">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5-4v14l-5-4H4z"></path><path id="voicePathA" d="M16 8.5a5 5 0 0 1 0 7"></path></svg>
    </button>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Duración</div>
      <div class="stat-value" id="totalText">0:00</div>
    </div>
    <div class="stat">
      <div class="stat-label">Acciones</div>
      <div class="stat-value" id="countText">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Paso</div>
      <div class="stat-value" id="stepText">—</div>
    </div>
  </div>

  <main class="list" id="list"></main>

  <footer class="controls">
    <button id="resetBtn" class="icon-btn" title="Reiniciar">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"></path><path d="M4 4v5h5"></path></svg>
    </button>
    <button id="playBtn" class="play-btn">▶ Play</button>
    <button id="skipBtn" class="icon-btn" title="Siguiente">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5l10 7-10 7z"></path><path d="M18 5v14"></path></svg>
    </button>
  </footer>

  <div class="player" id="player" hidden>
    <div class="player-top">
      <button id="closeBtn" class="icon-btn" title="Cerrar">✕</button>
      <div class="status-text" id="statusText">En pausa</div>
      <button id="voiceToggle2" class="icon-btn voice-btn" title="Voz">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5-4v14l-5-4H4z"></path><path id="voicePathA2" d="M16 8.5a5 5 0 0 1 0 7"></path></svg>
      </button>
    </div>

    <div class="ring-wrap">
      <svg viewBox="0 0 200 200" width="250" height="250" class="ring-svg">
        <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(46,154,168,.15)" stroke-width="15"></circle>
        <circle id="ring" cx="100" cy="100" r="86" fill="none" stroke="#2e9aa8" stroke-width="15" stroke-linecap="round" stroke-dasharray="540.35" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-center">
        <div class="cur-icon" id="curIcon"></div>
        <div class="time-text" id="timeText">0:00</div>
        <div class="restante">restante</div>
      </div>
    </div>

    <div class="cur-name" id="curName">Lista para empezar</div>
    <div class="next-text" id="nextText"></div>

    <div class="dots" id="dots"></div>

    <div class="spacer"></div>

    <div class="controls player-controls">
      <button id="resetBtn2" class="icon-btn big" title="Reiniciar">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"></path><path d="M4 4v5h5"></path></svg>
      </button>
      <button id="playBtn2" class="play-btn big">▶ Play</button>
      <button id="skipBtn2" class="icon-btn big" title="Siguiente">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5l10 7-10 7z"></path><path d="M18 5v14"></path></svg>
      </button>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
